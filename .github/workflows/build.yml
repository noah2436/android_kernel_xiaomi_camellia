name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: src_kernel
          fetch-depth: 1

      - name: Checkout Patch Repo
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          path: patches
          fetch-depth: 1

      - name: Checkout KernelSU-Next Reference
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: legacy
          path: src_kernel/drivers/kernelsu
          fetch-depth: 1

      - name: Apply KernelSU-Next Manual Hooks
        working-directory: src_kernel
        run: |
          # 1. Run the hook patcher while drivers/kernelsu is present so all hooks are detected
          bash ../patches/Patches/syscall_hook_patches.sh

          # 2. Remove temporary drivers/kernelsu folder so kernel_build_action can clone it cleanly
          rm -rf drivers/kernelsu

          # 3. Disable Kprobes in camellian_defconfig so manual hooks take over cleanly
          DEFCONFIG="arch/arm64/configs/camellian_defconfig"
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KPROBE_EVENTS=y/# CONFIG_KPROBE_EVENTS is not set/g' $DEFCONFIG

          # 4. Verify kernel/reboot.c was patched and commit all modified files
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Apply KernelSU-Next manual hooks"

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: file://${{ github.workspace }}/src_kernel
          kernel-branch: lineage-23.2
          config: camellian_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: true
          ksu-other: true
          ksu-url: ${{ github.server_url }}/KernelSU-Next/KernelSU-Next
          ksu-version: legacy
          disable-lto: true
          anykernel3: true
          extra-make-args: '["CONFIG_KSU_MANUAL_HOOK=y", "CONFIG_KSU_KPROBES_HOOK=n"]'
