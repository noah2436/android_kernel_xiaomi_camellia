name: Build Kernel
on:
  workflow_dispatch:
jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ${{ github.server_url }}/${{ github.repository }}
          kernel-branch: lineage-23.2
          config: camellian_defconfig
          merge-configs: '["ksu_manual.config"]'
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: true
          ksu-other: true
          ksu-url: ${{ github.server_url }}/KernelSU-Next/KernelSU-Next
          ksu-version: legacy
          disable-lto: true
          anykernel3: true
