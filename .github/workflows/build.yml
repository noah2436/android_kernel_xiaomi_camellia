name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: src_kernel
          fetch-depth: 1

      - name: Checkout Patch Repo
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          path: patches
          fetch-depth: 1

      - name: Checkout KernelSU-Next Reference
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: legacy
          path: src_kernel/drivers/kernelsu
          fetch-depth: 1

      - name: Apply KernelSU-Next Manual Hooks
        working-directory: src_kernel
        run: |
          # 1. Run community syscall patcher for fs/, security/, drivers/input/
          bash ../patches/Patches/syscall_hook_patches.sh

          # 2. Guarantee kernel/reboot.c has ksu_handle_sys_reboot (required by Kbuild:221)
          python3 - << 'EOF'
          with open("kernel/reboot.c", "r") as f:
              code = f.read()

          if "ksu_handle_sys_reboot" not in code:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\nSYSCALL_DEFINE4(reboot,"
              code = code.replace("SYSCALL_DEFINE4(reboot,", decl, 1)

              hook = "#ifdef CONFIG_KSU\n\tif (system_state == SYSTEM_RUNNING)\n\t\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\tif (!ns_capable("
              if "\tif (!ns_capable(" in code:
                  code = code.replace("\tif (!ns_capable(", hook, 1)
              else:
                  # Fallback: insert right after the opening brace of SYSCALL_DEFINE4(reboot
                  idx = code.find("SYSCALL_DEFINE4(reboot,")
                  brace = code.find("{", idx) + 1
                  code = code[:brace] + "\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif" + code[brace:]

              with open("kernel/reboot.c", "w") as f:
                  f.write(code)
          EOF

          # 3. Verify kernel/reboot.c contains the hook (fails immediately if missing)
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c

          # 4. Remove temporary drivers/kernelsu folder so kernel_build_action pulls it cleanly
          rm -rf drivers/kernelsu

          # 5. Set KernelSU manual hook flags and disable Kprobes directly in camellian_defconfig
          DEFCONFIG="arch/arm64/configs/camellian_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> $DEFCONFIG
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KPROBE_EVENTS=y/# CONFIG_KPROBE_EVENTS is not set/g' $DEFCONFIG

          # 6. Commit all patched files locally
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Apply KernelSU-Next manual hooks"

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: file://${{ github.workspace }}/src_kernel
          kernel-branch: lineage-23.2
          config: camellian_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: true
          ksu-other: true
          ksu-url: ${{ github.server_url }}/KernelSU-Next/KernelSU-Next
          ksu-version: legacy
          disable-lto: true
          anykernel3: true
          extra-make-args: '["CONFIG_KSU_MANUAL_HOOK=y", "CONFIG_KSU_KPROBES_HOOK=n"]'
