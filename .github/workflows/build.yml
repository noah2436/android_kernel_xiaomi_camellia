name: Build MIUI 14 Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout MIUI 14 Stock Kernel Source (camellian-t-oss)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          path: src_kernel
          fetch-depth: 1

      - name: Checkout Patch Repo
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          path: patches
          fetch-depth: 1

      - name: Checkout KernelSU-Next
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: legacy
          path: ksu_next
          fetch-depth: 1

      - name: Integrate KernelSU-Next & Manual Hooks
        working-directory: src_kernel
        run: |
          # 1. Copy KernelSU-Next dereferencing symlinks (-rL) so include/uapi resolves properly
          cp -rL ../ksu_next/kernel drivers/kernelsu
          rm -rf drivers/kernelsu/uapi drivers/kernelsu/policy/uapi
          mkdir -p drivers/kernelsu/uapi drivers/kernelsu/policy/uapi
          find ../ksu_next -name "*.h" -path "*/uapi/*" -exec cp {} drivers/kernelsu/uapi/ \;
          find ../ksu_next -name "*.h" -path "*/uapi/*" -exec cp {} drivers/kernelsu/policy/uapi/ \;

          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 2. Create placeholder camellian/cust.dtsi if absent & safe __weak Huaqin stubs
          mkdir -p arch/arm64/boot/dts/mediatek/camellian
          mkdir -p arch/arm64/boot/dts/include/camellian
          [ -f arch/arm64/boot/dts/mediatek/camellian/cust.dtsi ] || touch arch/arm64/boot/dts/mediatek/camellian/cust.dtsi
          [ -f arch/arm64/boot/dts/include/camellian/cust.dtsi ] || touch arch/arm64/boot/dts/include/camellian/cust.dtsi

          cat << 'EOF' > drivers/misc/hq_stubs.c
          #include <linux/module.h>
          #include <linux/types.h>

          __weak int hq_regiser_hw_info(int type, char *info) { return 0; }
          EXPORT_SYMBOL(hq_regiser_hw_info);

          __weak int get_huaqin_pcba_config(void) { return 0; }
          EXPORT_SYMBOL(get_huaqin_pcba_config);

          __weak int get_audio_pa_vendor(void) { return 0; }
          EXPORT_SYMBOL(get_audio_pa_vendor);
          EOF
          echo 'obj-y += hq_stubs.o' >> drivers/misc/Makefile

          # 3. Apply manual syscall hooks
          bash ../patches/Patches/syscall_hook_patches.sh

          # 4. Guarantee kernel/reboot.c has ksu_handle_sys_reboot
          python3 - << 'EOF'
          with open("kernel/reboot.c", "r") as f:
              code = f.read()

          if "ksu_handle_sys_reboot" not in code:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\nSYSCALL_DEFINE4(reboot,"
              code = code.replace("SYSCALL_DEFINE4(reboot,", decl, 1)

              hook = "#ifdef CONFIG_KSU\n\tif (system_state == SYSTEM_RUNNING)\n\t\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\tif (!ns_capable("
              if "\tif (!ns_capable(" in code:
                  code = code.replace("\tif (!ns_capable(", hook, 1)
              else:
                  idx = code.find("SYSCALL_DEFINE4(reboot,")
                  brace = code.find("{", idx) + 1
                  code = code[:brace] + "\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif" + code[brace:]

              with open("kernel/reboot.c", "w") as f:
                  f.write(code)
          EOF

          # 5. Configure camellian_defconfig cleanly & raise frame-warn threshold for Clang
          DEFCONFIG="arch/arm64/configs/camellian_defconfig"
          sed -i '/CONFIG_KPROBES/d' $DEFCONFIG
          sed -i '/CONFIG_HAVE_KPROBES/d' $DEFCONFIG
          sed -i '/CONFIG_KPROBE_EVENTS/d' $DEFCONFIG
          sed -i '/CONFIG_KSU/d' $DEFCONFIG
          sed -i '/CONFIG_FRAME_WARN/d' $DEFCONFIG
          if [ ! -d "../vendor/xiaomi/kernel_modules/mihw" ]; then
            sed -i '/CONFIG_MIHW/d' $DEFCONFIG
            sed -i '/mihw/d' drivers/Makefile
            sed -i '/mihw/d' drivers/Kconfig
          fi

          cat << 'EOF' >> $DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_FRAME_WARN=8192
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_SYSCALL_TABLE_HOOK is not set
          # CONFIG_KPROBES is not set
          # CONFIG_HAVE_KPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set
          EOF

          # 6. Commit into local src_kernel
          git init -q 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Integrate KernelSU-Next legacy into MiCode camellian-t-oss"

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: file://${{ github.workspace }}/src_kernel
          kernel-branch: camellian-t-oss
          config: camellian_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: false
          disable-lto: true
          anykernel3: true
