name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: src_kernel
          fetch-depth: 1

      - name: Checkout Patch Repo
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          path: patches
          fetch-depth: 1

      - name: Apply KernelSU-Next Manual Hooks
        working-directory: src_kernel
        run: |
          echo "=== PATCH SCRIPT CONTENT ==="
          cat ../patches/Patches/syscall_hook_patches.sh
          
          echo "=== CLONE KSU-NEXT TO INSPECT KBUILD ==="
          git clone --depth=1 -b legacy "${{ github.server_url }}/KernelSU-Next/KernelSU-Next.git" /tmp/ksu
          sed -n '170,235p' /tmp/ksu/kernel/Kbuild
          exit 1

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: file://${{ github.workspace }}/src_kernel
          kernel-branch: lineage-23.2
          config: camellian_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: true
          ksu-other: true
          ksu-url: ${{ github.server_url }}/KernelSU-Next/KernelSU-Next
          ksu-version: legacy
          disable-lto: true
          anykernel3: true
          extra-make-args: '["CONFIG_KSU_MANUAL_HOOK=y", "CONFIG_KSU_KPROBES_HOOK=n"]'
